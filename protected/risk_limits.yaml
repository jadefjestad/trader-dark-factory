# PROTECTED (CODEOWNERS). Hard limits enforced by factory/risk.py before any order.
trading_enabled: true          # kill switch: set false to stop all order submission
paper_only: true               # must stay true; execution refuses to run otherwise
allow_short: false
max_gross_exposure: 1.00       # fraction of equity, no leverage
max_position_weight: 0.15
min_price: 5.0
max_order_notional: 25000
min_order_notional: 50
max_orders_per_run: 60
max_run_turnover: 1.00         # sum |order notional| / equity per run
max_drawdown_halt: 0.20        # halt new orders if equity is 20% below its 1-year peak
max_data_staleness_days: 4     # last completed daily bar must be this recent (calendar days)
cash_buffer: 0.02              # size targets on 98% of equity to absorb price moves before fills
price_buffer: 0.03             # assume buys fill up to 3% above the latest trade when checking limits
max_price_gap: 0.25            # reject a latest trade more than 25% away from the last close (bad data)
max_quote_age_minutes: 30      # latest trade must be this fresh
hold_rebalance_tolerance: 0.03 # on "hold" days, only fix positions more than 3 points off the last decision

# Streaming paper tier (docs/streaming-design.md 3.4, issue #76). Enforced by factory/stream/engine.py.
# Tighter than the daily limits while the tier is unproven. It runs on its own paper account.
stream:
  max_gross_exposure: 0.50
  max_position_weight: 0.10
  max_orders_per_minute: 30            # well under Alpaca's ~200 API calls a minute
  max_orders_per_day: 500
  min_seconds_between_trades_per_symbol: 30
  max_daily_loss: 0.01                 # 1% of start-of-day equity: flatten and stop for the day
  max_stream_gap_seconds: 30           # a symbol with no trade or quote this long gets no new orders
  max_feed_gap_seconds: 10             # nothing at all this long: no new orders anywhere
  flatten_at: "15:55"                  # New York time

# Intraday paper funds (15-minute strategies in state/funds.yaml), run by factory/intraday.py once per bar.
# The daily limits above all apply too, except that max_run_turnover is replaced by the value here.
intraday:
  feed: iex                    # live 15-minute bars: IEX is real-time on the free plan (docs/intraday-data.md)
  history_days: 10             # calendar days of bars fetched each bar for the strategy's lookback
  decision_delay_seconds: 45   # wait this long after a bar ends before reading it, so the bar is complete
  max_bar_age_minutes: 10      # the newest completed bar must have ended this recently
  max_missing_bars: 2          # a symbol may lack this many recent bars (filled from the last price); more fails
  max_run_turnover: 2.00       # sum |order notional| / equity per bar: a full rotation out of one book into another
  max_orders_per_day: 400      # per fund, counted from the account's orders today
  max_daily_loss: 0.03         # 3% below the previous close: flatten and trade no more that day
  flatten_bars_before_close: 2 # decisions on the last two bars are flat, as the backtester models it
