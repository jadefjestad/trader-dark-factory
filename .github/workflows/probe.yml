# Checks which alternative data sources the factory can reach from Actions and how much history they
# hold. It reads data and never places orders. Runs on demand and weekly in market hours, so the
# IEX spread probe (issue #74) sees live quotes.
name: probe-sources
on:
  workflow_dispatch:
  schedule:
    - cron: "40 15 * * 1"   # Mondays 11:40 New York (10:40 in winter): regular session
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe news, SEC EDGAR and FRED
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m factory.sources probe --out probe.json
          { echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # annotations are readable through the REST check-runs API, unlike logs and artifacts
          python -c "import json; [print(f'::notice title=probe {k}::' + json.dumps(v, default=str)) for k, v in json.load(open('probe.json')).items()]"
      - name: Probe intraday feeds (issue #67)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -m factory.intraday_probe --out intraday_probe.json
          { echo '```json'; cat intraday_probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; [print(f'::notice title=intraday {k}::' + json.dumps(v, default=str)) for k, v in json.load(open('intraday_probe.json')).items()]"
      - name: Probe FINRA short-sale data (issue #65)
        run: |
          python -m factory.shorts probe --out shorts_probe.json
          { echo '```json'; cat shorts_probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; [print(f'::notice title=shorts {k}::' + json.dumps(v, default=str)) for k, v in json.load(open('shorts_probe.json')).items()]"
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe.json
            intraday_probe.json
            shorts_probe.json
