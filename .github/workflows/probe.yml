# Checks which alternative data sources the factory can reach from Actions and how much history they
# hold. Manual only; it reads data and never places orders.
name: probe-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe news, SEC EDGAR and FRED
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python -m factory.sources probe --out probe.json
          { echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # annotations are readable through the REST check-runs API, unlike logs and artifacts
          python -c "import json; [print(f'::notice title=probe {k}::' + json.dumps(v, default=str)) for k, v in json.load(open('probe.json')).items()]"
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.json
