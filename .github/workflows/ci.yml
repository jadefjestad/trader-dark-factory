name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Guard (protected paths, no live endpoints, candidate sandbox)
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GUARD_HEAD_REF: ${{ github.head_ref }}
        run: |
          # run the BASE branch's guard so a PR cannot weaken the guard that judges it
          if [ -n "$GUARD_BASE" ] && git cat-file -e "$GUARD_BASE:scripts/guard.py" 2>/dev/null; then
            git show "$GUARD_BASE:scripts/guard.py" > "$RUNNER_TEMP/guard.py"
            GUARD_ROOT="$PWD" python "$RUNNER_TEMP/guard.py"
          else
            python scripts/guard.py
          fi
