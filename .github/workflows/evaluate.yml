# Evaluates candidate strategies in experiment PRs against the protected rules on main.
# The workflow, evaluator and rules always come from the BASE branch. From the PR it takes only new
# candidate files (validated names, no symlinks, never overwriting a base file) and, in the report job,
# the champion manifest. Candidate code runs as an unprivileged OS user in a job with no secrets.
name: evaluate
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      candidate:
        description: "Strategy file or module:Class. Blank evaluates every baseline."
        required: false
      intraday:
        description: "Also download 15-minute history (slow on the free plan: several minutes)"
        type: boolean
        default: false
concurrency:
  group: evaluate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      candidates: ${{ steps.diff.outputs.candidates }}
      champion_changed: ${{ steps.diff.outputs.champion_changed }}
      needs_data: ${{ steps.diff.outputs.needs_data }}
      timeframes: ${{ steps.diff.outputs.timeframes }}
      extra: ${{ steps.diff.outputs.extra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_CANDIDATE: ${{ inputs.candidate }}
          DISPATCH_INTRADAY: ${{ inputs.intraday }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          valid='^(strategies/candidates/[A-Za-z0-9_]+\.py|strategies\.baselines\.[a-z_]+:[A-Za-z]+)$'
          # extra data panels named by the candidates or the champion (files are read as text, never run)
          extra_for() {
            ch=$(python3 -c "import json; print(json.load(open('state/champion.json')).get('ref', ''))" 2>/dev/null || true)
            names=""
            for f in "$@" $ch; do
              [ -f "$f" ] || continue
              for n in news_count news_sentiment macro; do grep -Eq "extra_data *=.*[\"']$n[\"']" "$f" && names="$names,$n"; done
            done
            printf '%s' "$names" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd, - || true
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_CANDIDATE" ] && ! printf '%s' "$DISPATCH_CANDIDATE" | grep -Eq "$valid"; then
              echo "::error::invalid candidate reference"; exit 1
            fi
            tf=1Day
            if [ "$DISPATCH_INTRADAY" = "true" ] || printf '%s' "$DISPATCH_CANDIDATE" | grep -q intraday; then tf=1Day,15Min; fi
            if [ -n "$DISPATCH_CANDIDATE" ] && [ -f "$DISPATCH_CANDIDATE" ] && grep -Eq "timeframe *= *[\"']15Min[\"']" "$DISPATCH_CANDIDATE"; then tf=1Day,15Min; fi
            { echo "candidates=$DISPATCH_CANDIDATE"; echo "champion_changed=false"; echo "needs_data=true"; echo "timeframes=$tf"
              echo "extra=$(extra_for $DISPATCH_CANDIDATE)"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'strategies/candidates/' | grep -v -e '__init__.py$' -e '\.md$' || true)
          bad=$(printf '%s\n' "$changed" | grep -v -E "$valid" | grep -v '^$' || true)
          if [ -n "$bad" ]; then echo "::error::candidate files must be strategies/candidates/<letters_digits_underscores>.py"; exit 1; fi
          c=$(printf '%s\n' "$changed" | tr '\n' ' ' | sed 's/ *$//')
          ch=$(git diff --name-only "$BASE_SHA"...HEAD -- state/champion.json | wc -l)
          tf=1Day   # 15-minute history is slow to download, so fetch it only for intraday candidates (read as text, never run)
          for f in $c; do grep -Eq "timeframe *= *[\"']15Min[\"']" "$f" && tf=1Day,15Min; done
          { echo "candidates=$c"
            echo "timeframes=$tf"
            echo "extra=$(extra_for $c)"
            echo "champion_changed=$([ "$ch" -gt 0 ] && echo true || echo false)"
            echo "needs_data=$([ -n "$c" ] || [ "$ch" -gt 0 ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

  data:
    needs: plan
    if: needs.plan.outputs.needs_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4          # base branch code only
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: bars-${{ hashFiles('protected/*.yaml') }}-${{ needs.plan.outputs.timeframes }}-${{ steps.day.outputs.day }}
      - uses: actions/cache/restore@v4     # complete years of news, filled by the news-backfill workflow
        if: contains(needs.plan.outputs.extra, 'news_')
        with:
          path: data/cache/news_*.csv.gz
          key: news-v1-none
          restore-keys: news-v1-
      - name: Download market data
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIMEFRAMES: ${{ needs.plan.outputs.timeframes }}
          EXTRA: ${{ needs.plan.outputs.extra }}
        run: python -m factory.prefetch --timeframes "$TIMEFRAMES" --extra "$EXTRA"
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/cache
          retention-days: 3

  evaluate:
    needs: [plan, data]
    if: needs.plan.outputs.needs_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4          # base branch: evaluator, rules, baselines
        with:
          persist-credentials: false
      - uses: actions/checkout@v4          # PR head, used only as a source of NEW candidate files
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-data
          path: data/cache
      - name: Create unprivileged sandbox user for strategy code
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin sandbox
      - name: Evaluate candidates (no secrets in this job)
        env:
          CANDIDATES: ${{ needs.plan.outputs.candidates }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || 'manual' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          TIMEFRAMES: ${{ needs.plan.outputs.timeframes }}
          FACTORY_SANDBOX_USER: sandbox
        run: |
          mkdir -p out/results
          touch out/errors.txt
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$CANDIDATES" ]; then
            python -m factory.evaluate --baselines --timeframes "$TIMEFRAMES" --data alpaca --out out/results 2>err.log \
              || { echo "baseline evaluation failed"; tail -30 err.log; } >> out/errors.txt
            exit 0
          fi
          if [ -z "$CANDIDATES" ]; then   # champion change only: re-evaluate the referenced candidate
            CANDIDATES=$(python -c "import json;r=json.load(open('pr/state/champion.json'))['ref'];print(r if r.endswith('.py') else '')")
          fi
          for f in $CANDIDATES; do
            if ! printf '%s' "$f" | grep -Eq '^(strategies/candidates/[A-Za-z0-9_]+\.py|strategies\.baselines\.[a-z_]+:[A-Za-z]+)$'; then
              echo "refusing invalid candidate reference: $f" >> out/errors.txt; continue
            fi
            case "$f" in
              *.py)
                if [ -L "pr/$f" ] || { [ ! -e "$f" ] && [ ! -f "pr/$f" ]; }; then
                  echo "candidate $f is missing or a symlink" >> out/errors.txt; continue
                fi
                [ -e "$f" ] || cp "pr/$f" "$f"   # never overwrite a file that exists on the base branch
                name=$(basename "$f" .py) ;;
              *) name=$(printf '%s' "${f#*:}" | tr 'A-Z' 'a-z') ;;
            esac
            python -m factory.evaluate --candidate "$f" --data alpaca --out out/results \
              --experiment-id "pr${PR}-${SHA:0:7}-${name}-r${RUN}" 2>err.log \
              || { echo "evaluation of $f failed"; tail -30 err.log; } >> out/errors.txt
          done
          rm -rf pr
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: out

  report:
    needs: [plan, evaluate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4          # base branch: verdict script and the current champion
      - uses: actions/checkout@v4          # PR head, read-only: champion manifest and its code
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        if: needs.evaluate.result == 'success'
        with:
          name: evaluation
          path: out
      - name: Verdict
        id: verdict
        env:
          NEEDS_DATA: ${{ needs.plan.outputs.needs_data }}
          EVAL_RESULT: ${{ needs.evaluate.result }}
        run: |
          mkdir -p out/results
          touch out/errors.txt
          if [ "$NEEDS_DATA" = "true" ] && [ "$EVAL_RESULT" != "success" ]; then
            echo "Evaluation job did not finish ($EVAL_RESULT). Check the data download (Alpaca secrets) and logs." >> out/errors.txt
          fi
          set +e
          python scripts/pr_verdict.py --results out/results --head-champion head/state/champion.json \
            --base-champion state/champion.json --head-root head --errors out/errors.txt --out verdict.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "promote=$(python -c "import json,glob;print(any(json.load(open(p))['promote'] for p in glob.glob('out/results/*.json')))")" >> "$GITHUB_OUTPUT"
      - name: Record every result on the ledger branch
        if: hashFiles('out/results/*.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: scripts/ledger_append.sh experiments "experiment results from run $RUN" out/results/*
      - name: Comment and label the PR
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          CANDIDATES: ${{ needs.plan.outputs.candidates }}
          PROMOTE: ${{ steps.verdict.outputs.promote }}
        run: |
          gh label create promote --color 2ea44f --force >/dev/null
          gh label create rejected --color d73a4a --force >/dev/null
          gh label create experiment --color 5319e7 --force >/dev/null
          gh pr comment "$PR" --body-file verdict.md
          if [ -n "$CANDIDATES" ]; then
            gh pr edit "$PR" --add-label experiment
            if [ "$PROMOTE" = "True" ]; then
              gh pr edit "$PR" --add-label promote; gh pr edit "$PR" --remove-label rejected || true
            else
              gh pr edit "$PR" --add-label rejected; gh pr edit "$PR" --remove-label promote || true
            fi
          fi
      - name: Auto-merge verified promotions
        if: github.event_name == 'pull_request_target' && vars.AUTO_PROMOTE == 'true' && needs.plan.outputs.champion_changed == 'true' && steps.verdict.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash
      - name: Fail the check if the verdict failed
        if: steps.verdict.outputs.code != '0'
        run: exit 1
