# Refreshes the README's results block after each trading day from the ledger and the paper account. No Claude needed.
name: readme
on:
  schedule:
    - cron: "30 21 * * 1-5"   # after the US close in summer and winter
  workflow_dispatch:
concurrency:
  group: readme
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: ledger
          path: ledger
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rewrite the results block
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m factory.readme --ledger ledger --readme README.md
      - name: Commit to main if anything changed
        run: |
          git diff --quiet README.md && { echo "README unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp README.md "$RUNNER_TEMP/README.md"
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main && git reset --quiet --hard origin/main
            python -m factory.readme --ledger ledger --readme README.md --no-broker --block-from "$RUNNER_TEMP/README.md"
            git diff --quiet README.md && exit 0
            git commit --quiet -am "readme: refresh results" && git push --quiet origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "README push failed after retries" >&2; exit 1
