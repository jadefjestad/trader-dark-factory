# Rebuilds RESULTS.md on the `results` branch after each trading day from the ledger and the paper account. No Claude needed.
name: readme
on:
  schedule:
    - cron: "30 21 * * 1-5"   # after the US close in summer and winter
  workflow_dispatch:
concurrency:
  group: readme
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: ledger
          path: ledger
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build RESULTS.md
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # one paper account per fund (state/funds.yaml); fund 1 falls back to the two above, missing funds are skipped
          ALPACA_FUND_1_KEY_ID: ${{ secrets.ALPACA_FUND_1_KEY_ID }}
          ALPACA_FUND_1_SECRET_KEY: ${{ secrets.ALPACA_FUND_1_SECRET_KEY }}
          ALPACA_FUND_2_KEY_ID: ${{ secrets.ALPACA_FUND_2_KEY_ID }}
          ALPACA_FUND_2_SECRET_KEY: ${{ secrets.ALPACA_FUND_2_SECRET_KEY }}
          ALPACA_FUND_3_KEY_ID: ${{ secrets.ALPACA_FUND_3_KEY_ID }}
          ALPACA_FUND_3_SECRET_KEY: ${{ secrets.ALPACA_FUND_3_SECRET_KEY }}
          ALPACA_FUND_4_KEY_ID: ${{ secrets.ALPACA_FUND_4_KEY_ID }}
          ALPACA_FUND_4_SECRET_KEY: ${{ secrets.ALPACA_FUND_4_SECRET_KEY }}
          ALPACA_FUND_5_KEY_ID: ${{ secrets.ALPACA_FUND_5_KEY_ID }}
          ALPACA_FUND_5_SECRET_KEY: ${{ secrets.ALPACA_FUND_5_SECRET_KEY }}
          ALPACA_FUND_6_KEY_ID: ${{ secrets.ALPACA_FUND_6_KEY_ID }}
          ALPACA_FUND_6_SECRET_KEY: ${{ secrets.ALPACA_FUND_6_SECRET_KEY }}
          ALPACA_FUND_7_KEY_ID: ${{ secrets.ALPACA_FUND_7_KEY_ID }}
          ALPACA_FUND_7_SECRET_KEY: ${{ secrets.ALPACA_FUND_7_SECRET_KEY }}
          ALPACA_FUND_8_KEY_ID: ${{ secrets.ALPACA_FUND_8_KEY_ID }}
          ALPACA_FUND_8_SECRET_KEY: ${{ secrets.ALPACA_FUND_8_SECRET_KEY }}
          ALPACA_FUND_9_KEY_ID: ${{ secrets.ALPACA_FUND_9_KEY_ID }}
          ALPACA_FUND_9_SECRET_KEY: ${{ secrets.ALPACA_FUND_9_SECRET_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          printf '# Trader Dark Factory results\n\nRebuilt every weekday after the close by `.github/workflows/readme.yml`. Background and lessons: [README](https://github.com/%s#readme).\n' "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/site/RESULTS.md"
          python -m factory.readme --ledger ledger --readme "$RUNNER_TEMP/site/RESULTS.md"
      - name: Publish to the results branch
        # main only accepts pull requests, so the daily figures live on their own branch (history replaced each run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init --quiet -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md
          git commit --quiet -m "results: refresh"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:results
