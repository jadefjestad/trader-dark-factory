# Runs each fund's strategy (state/funds.yaml) on its own Alpaca PAPER account every weekday after the open. Needs no Claude access.
name: execute
on:
  schedule:
    - cron: "0 15 * * 1-5"    # 11:00 ET in summer, 10:00 ET in winter
    - cron: "30 17 * * 1-5"   # backup run if the first is delayed or dropped; it trades only the remaining difference
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute orders without submitting"
        type: boolean
        default: true
concurrency:
  group: execute
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4     # past years of news for strategies that use it
        with:
          path: data/cache/news_*.csv.gz
          key: news-v1-none
          restore-keys: news-v1-
      - uses: actions/cache/restore@v4     # published quarters of SEC insider data for strategies that use it
        with:
          path: data/cache/sec_insiders_*q*_*.csv.gz
          key: sec-insiders-v1-none
          restore-keys: sec-insiders-v1-
      - uses: actions/cache/restore@v4     # complete years of FINRA short volume for strategies that use it
        with:
          path: data/cache/shorts_*.csv.gz
          key: shorts-v1-none
          restore-keys: shorts-v1-
      - name: Create unprivileged sandbox user for strategy code
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin sandbox
      - name: Execute every funded paper account
        id: run
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # one paper account per fund (state/funds.yaml); fund 1 falls back to the two above, missing funds are skipped
          ALPACA_FUND_1_KEY_ID: ${{ secrets.ALPACA_FUND_1_KEY_ID }}
          ALPACA_FUND_1_SECRET_KEY: ${{ secrets.ALPACA_FUND_1_SECRET_KEY }}
          ALPACA_FUND_2_KEY_ID: ${{ secrets.ALPACA_FUND_2_KEY_ID }}
          ALPACA_FUND_2_SECRET_KEY: ${{ secrets.ALPACA_FUND_2_SECRET_KEY }}
          ALPACA_FUND_3_KEY_ID: ${{ secrets.ALPACA_FUND_3_KEY_ID }}
          ALPACA_FUND_3_SECRET_KEY: ${{ secrets.ALPACA_FUND_3_SECRET_KEY }}
          ALPACA_FUND_4_KEY_ID: ${{ secrets.ALPACA_FUND_4_KEY_ID }}
          ALPACA_FUND_4_SECRET_KEY: ${{ secrets.ALPACA_FUND_4_SECRET_KEY }}
          ALPACA_FUND_5_KEY_ID: ${{ secrets.ALPACA_FUND_5_KEY_ID }}
          ALPACA_FUND_5_SECRET_KEY: ${{ secrets.ALPACA_FUND_5_SECRET_KEY }}
          ALPACA_FUND_6_KEY_ID: ${{ secrets.ALPACA_FUND_6_KEY_ID }}
          ALPACA_FUND_6_SECRET_KEY: ${{ secrets.ALPACA_FUND_6_SECRET_KEY }}
          ALPACA_FUND_7_KEY_ID: ${{ secrets.ALPACA_FUND_7_KEY_ID }}
          ALPACA_FUND_7_SECRET_KEY: ${{ secrets.ALPACA_FUND_7_SECRET_KEY }}
          ALPACA_FUND_8_KEY_ID: ${{ secrets.ALPACA_FUND_8_KEY_ID }}
          ALPACA_FUND_8_SECRET_KEY: ${{ secrets.ALPACA_FUND_8_SECRET_KEY }}
          ALPACA_FUND_9_KEY_ID: ${{ secrets.ALPACA_FUND_9_KEY_ID }}
          ALPACA_FUND_9_SECRET_KEY: ${{ secrets.ALPACA_FUND_9_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FACTORY_SANDBOX_USER: sandbox
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then python -m factory.execute --out out --dry-run; else python -m factory.execute --out out; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Record run on the ledger branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: scripts/ledger_append.sh executions "execution run $RUN" out/*.json
      - name: Fail visibly when no orders were placed because of an error
        if: steps.run.outputs.code != '0'
        run: exit 1
