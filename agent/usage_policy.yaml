# Rule file (changes need a Reason: line and are logged to the ledger). How hard the research agent may push the Claude subscription.
# Claude does not expose remaining usage to a Routine, so the factory budgets by counting its own
# runs and by noticing runs that never finished (the usual sign of hitting a usage limit).
max_runs_per_day: 10           # raised from 5 on 2026-10-04: 4 runs used, 0 cut off, plan limit had room
max_runs_per_5h: 4             # Pro usage resets on a rolling 5-hour window
tasks_per_run: {start: 1, min: 1, max: 3}
cooldown_after_limit_hours: 5  # after a run is cut off, skip work until the window has reset
unfinished_after_minutes: 90   # a run with no end marker after this long counts as cut off
